# /etc/nginx/sites-available/site-__DOMAIN__.conf — создаётся командой sitectl add
# HTTPS добавляет certbot (sitectl ssl) — он сам допишет блок 443 и редирект с http.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/sites/__DOMAIN__/dist;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml application/json text/xml application/xml;

    location /assets/ {
        include snippets/site-security.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        include snippets/site-security.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Заявки и админ-панель (Node.js, служба site@__DOMAIN__)
    location /api/ {
        client_max_body_size 80m;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    error_page 404 /404.html;
}
